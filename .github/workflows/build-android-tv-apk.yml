name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tv-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        working-directory: ./apps/tv-mobile
        run: flutter pub get

      - name: Build Android TV Release APK
        working-directory: ./apps/tv-mobile
        run: flutter build apk --release --target-platform android-arm64

      - name: Rename Android TV APK Artifact
        working-directory: ./apps/tv-mobile
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-android-tv-release.apk

      - name: Upload Android TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillFilm-AndroidTV-Release-APK
          path: ./apps/tv-mobile/build/app/outputs/flutter-apk/app-android-tv-release.apk
