name: Build Android TV APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tv:
    name: Build Android TV APKs (ARM32 + ARM64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        working-directory: ./apps/tv-mobile
        run: flutter pub get

      - name: Build Android TV Release APKs (Split per ABI)
        working-directory: ./apps/tv-mobile
        run: flutter build apk --release --split-per-abi

      - name: Organize Android TV APK Artifacts
        working-directory: ./apps/tv-mobile
        run: |
          mkdir -p build/tv-apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/tv-apks/ChillFilm-TV-ARM32-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/tv-apks/ChillFilm-TV-ARM64-v8a.apk

      - name: Upload Android TV APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChillFilm-AndroidTV-Release-APKs
          path: ./apps/tv-mobile/build/tv-apks/*
