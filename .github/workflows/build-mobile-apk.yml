name: Build Mobile & Tablet APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mobile:
    name: Build Mobile & Tablet Universal APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        working-directory: ./apps/tv-mobile
        run: flutter pub get

      - name: Build Mobile Universal Release APK
        working-directory: ./apps/tv-mobile
        run: flutter build apk --release

      - name: Organize Mobile APK Artifact
        working-directory: ./apps/tv-mobile
        run: |
          mkdir -p build/mobile-apks
          cp build/app/outputs/flutter-apk/app-release.apk build/mobile-apks/ChillFilm-Mobile-Tablet-Universal.apk

      - name: Upload Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChillFilm-Mobile-Tablet-Release-APK
          path: ./apps/tv-mobile/build/mobile-apks/*
