name: Build Mobile Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-mobile-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        working-directory: ./apps/tv-mobile
        run: flutter pub get

      - name: Build Split ABI Release APKs (ARM32 + ARM64)
        working-directory: ./apps/tv-mobile
        run: flutter build apk --release --split-per-abi

      - name: Organize Mobile APK Artifacts
        working-directory: ./apps/tv-mobile
        run: |
          mkdir -p build/mobile-apks
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/mobile-apks/ChillFilm-Mobile-ARM32.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/mobile-apks/ChillFilm-Mobile-ARM64.apk

      - name: Upload Mobile APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChillFilm-Mobile-Release-APKs
          path: ./apps/tv-mobile/build/mobile-apks/
