name: Build Android TV & Mobile APKs

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Get Flutter Packages
        working-directory: ./apps/tv-mobile
        run: flutter pub get

      - name: Build Universal & Split ABI Release APKs
        working-directory: ./apps/tv-mobile
        run: |
          flutter build apk --release
          flutter build apk --release --split-per-abi

      - name: Organize All Release APKs
        working-directory: ./apps/tv-mobile
        run: |
          mkdir -p build/all-apks
          cp build/app/outputs/flutter-apk/app-release.apk build/all-apks/ChillFilm-Universal.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/all-apks/ChillFilm-ARM32-TVBox.apk || true
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/all-apks/ChillFilm-ARM64.apk || true

      - name: Upload All APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ChillFilm-All-Device-APKs
          path: ./apps/tv-mobile/build/all-apks/*
